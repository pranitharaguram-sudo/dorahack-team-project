<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quest Journal</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>⚔️ Quest Journal</h1>
    <p>Turn your daily goals into heroic achievements.</p>
  </header>

  <main>
    <aside>
      <section class="card profile">
        <div class="avatar">👤</div>
        <h2>Adventurer</h2>
        <p class="muted">Level <span id="level">1</span></p>

        <div class="xp-section">
          <div class="muted xp-label">
            XP <span><span id="xp">0</span> / 100</span>
          </div>
          <div class="progress">
            <span id="progress"></span>
          </div>
        </div>

        <button id="restartButton" class="restart-button" type="button">
          Restart Journey
        </button>
      </section>

      <section class="card streak-card">
        <div class="streak-icon">🔥</div>
        <strong><span id="streak">0</span> Day Streak</strong>
        <p class="muted streak-description">Build your legend!</p>
      </section>
    </aside>

    <section>
      <h2>Today's Challenges</h2>

      <div class="stats">
        <div class="stat">
          <span class="muted">Total Quests</span>
          <strong id="total">0</strong>
        </div>
        <div class="stat">
          <span class="muted">Completed</span>
          <strong id="completed">0</strong>
        </div>
        <div class="stat">
          <span class="muted">Lifetime XP</span>
          <strong id="totalXp">0</strong>
        </div>
      </div>

      <div class="card">
        <form id="questForm">
          <input id="questTitle" type="text" placeholder="Enter a new quest..." required />
          <select id="difficulty">
            <option value="easy">Easy · 10 XP</option>
            <option value="medium" selected>Medium · 25 XP</option>
            <option value="hard">Hard · 50 XP</option>
          </select>
          <button class="add-button" type="submit">Add Quest</button>
        </form>

        <div id="questList" class="quest-list"></div>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
